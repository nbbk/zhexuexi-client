# 堆上限 2G：模板默认 8G，但 §11 构建机最低只要 2 核/4GB，8G 会在小内存机器上 OOM。
# preferIPv4Stack：本机沙箱里 Java 默认走 IPv6 映射回环，Gradle daemon 握手后写
# socket 会 Broken pipe（见 docs/versions.md）；强制 IPv4 后 daemon 通信恢复正常。
# 正常 Windows / macOS 机器上该标志无害。
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv4Stack=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
