# 哲学系客户端 — GitHub 免费 CI
#
# 手动打包入口（不用等 tag，不用本地编）：
#   仓库 → Actions → build → Run workflow，填下面五个输入，点运行。
#   产物在那次运行页面的底部 Artifacts 里下载，保留 90 天。
#
# 五个输入（workflow_dispatch）：
#   brand_name：应用名（默认“哲学系”），改包内 brand.json 的 app_name，
#     并同步 Windows 原生窗口标题（main.cpp）与版本信息串
#     （Runner.rc 的 FileDescription/ProductName）；exe 文件名
#     （哲学系.exe）不随品牌改。
#   version：版本号 x.y.z（留空时产物名用分支/tag 名）。
#   logo_url：Logo 图片地址（选填）。空着用仓里自带的 Logo；
#     填了会在构建前下载，替换包内 Logo（assets/logo/logo.png，
#     应用内顶栏与启动器图标源图都用它），并重编 Android 启动器图标
#     与 Windows .ico（各 job 里分别重编）。
#     支持 PNG / JPG / WebP / BMP / GIF 等常见格式（见
#     apps/flutter_client/tool/normalize_logo.py），下载后统一转成
#     PNG；不是图片时构建直接报错，不出包。
#     Logo 是整个换的：底色也是 Logo 的一部分，传什么底色、启动器
#     图标就是什么底色，不再贴到墨蓝底上。最好传方形图（含底色），
#     如 1024×1024；非方形按 cover 居中裁切填满，不拉伸
#     （见 apps/flutter_client/tool/regen_launcher_icons.py）。
#   remote_config_domain：远程配置域名（选填，如 cc.jiankong.cf）。
#     空着用仓里默认值；填了只换远程配置默认地址
#     （lib/services/remote_config_service.dart 的 workerConfigUrl）
#     里的域名，其他代码不动。填完整 URL 也行，只取 host。
#
# 自动触发：push tag v* 时也跑（version 取 tag 名；platform 为空时两个任务都跑）。
#
# Secrets（仓库 Settings → Secrets and variables → Actions 里填，
# 绝不写进代码、不打日志；fork 不会带走 Secrets，新仓须重填）：
#   Android 正式版（release 签名，4 个，缺一不可；只填 keystore
#   不填密码时构建直接报错，不静默出未签名包）：
#     ANDROID_KEYSTORE_BASE64：release keystore 文件的 base64
#       （本地跑 base64 -w0 <keystore 文件> 得到，别贴到聊天里）。
#     ANDROID_KEYSTORE_PASSWORD：keystore 的 storePassword。
#     ANDROID_KEY_PASSWORD：key 的 keyPassword。
#     ANDROID_KEY_ALIAS：keyAlias（如 zhexuexi）。
#     没填 keystore 时只编 debug 包供测试（不能升级、不是正式版）。
#   Windows 签名（2 个）：
#     WINDOWS_CERT_BASE64：OV 证书 pfx 的 base64。
#     WINDOWS_CERT_PASSWORD：证书密码。
#     没填时只出未签名包供测试。
#
# 产物：
#   Android：分架构三个 APK（arm64-v8a / armeabi-v7a / x86_64，
#     各带 .sha256），小米手机用 arm64-v8a。
#   Windows：未签名或已签名的 exe，打成 zip（解压即用：exe＋
#     flutter_windows.dll＋data/ 都在里面，双击 exe 就能跑）。
#   注意：Windows 资产里的 sing-box.exe 不进仓（太大，Git Data API
#     拒收），Windows job 在构建前从打补丁的源码交叉编译 1.14.4
#     （见 tool/sing-box-patches/README.md；未打补丁的上游版握不过
#     Xray v26.11.9 的 REALITY）；helper（自研小二进制）在仓里。
#
# 注意：流程已多次跑绿；跑不通时先看 Actions 日志，不要声称 CI 跑过。
#
# 免费说明（§12.0）：本仓是公开仓，GitHub Actions 不计分钟数、免费。
# 私有仓才有免费额度上限；fork 到别的公开仓，CI 照样免费跑。

name: build

on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: "应用名（默认：哲学系）"
        required: false
        default: "哲学系"
        type: string
      version:
        description: "版本号 x.y.z（留空自动用最新 tag +1，见 §11.5）"
        required: false
        default: ""
        type: string
      logo_url:
        description: "Logo 图片地址（PNG/JPG/WebP 等，选填；空着用仓里自带的 Logo；底色也是 Logo 的一部分，整个换）"
        required: false
        default: ""
        type: string
      remote_config_domain:
        description: "远程配置域名（选填，如 cc.jiankong.cf；空着用仓里默认值）"
        required: false
        default: ""
        type: string
      platform:
        description: "打包平台（all：Windows＋安卓一起打；windows：只打 Windows 版（zip，解压即用）；android：只打安卓 APK）。打 tag 发版时此项为空，按全部处理，两个任务都跑。"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - android
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    # 平台门控：手动触发时按 platform 输入选；push tag 时 inputs 为空，
    # github.event_name == 'push' 兜底，两个任务都跑，不会跳过。
    if: ${{ github.event_name == 'push' || inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/flutter_client
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Java 17（Android 构建要用）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Flutter（版本见 docs/versions.md，阶段 0 钉死 3.50.1）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: 品牌注入（§11.1）
        # 改包内默认 brand.json 的 app_name，并同步 Windows 原生窗口标题
        # 与版本信息串；颜色/Logo/订阅地址等其他品牌变量在阶段 1 由远程
        # 配置中心下发，不在这里填。没传 brand_name 时不动包内文件，
        # 直接用默认值构建。
        run: |
          $brandName = "${{ inputs.brand_name }}"
          if ($brandName -ne '') {
            $brandFile = "assets/brand.json"
            $brand = Get-Content $brandFile -Raw | ConvertFrom-Json
            $brand.brand.app_name = $brandName
            $brand | ConvertTo-Json -Depth 5 | Out-File $brandFile -Encoding utf8
            Write-Host "品牌注入完成：应用名=$brandName"
            # Windows 原生标题与版本信息串（0.1.19）：main.cpp 的窗口标题
            # 与 Runner.rc 的 FileDescription/ProductName 跟着品牌名走；
            # InternalName/OriginalFilename 是文件身份（哲学系.exe），
            # 不随品牌改。UTF-8 无 BOM 写回（.rc 有 #pragma code_page(65001)，
            # main.cpp 靠 /utf-8 编译选项）。
            $utf8NoBom = [Text.UTF8Encoding]::new($false)
            $cppFile = "windows\runner\main.cpp"
            $cpp = [IO.File]::ReadAllText((Resolve-Path $cppFile).Path, [Text.Encoding]::UTF8)
            if ($cpp -match 'window\.Create\(L"([^"]*)"') {
              $curTitle = $Matches[1]
              if ($curTitle -ne $brandName) {
                $cpp = $cpp.Replace('window.Create(L"' + $curTitle + '"', 'window.Create(L"' + $brandName + '"')
              }
            } else { throw "main.cpp 里没找到窗口标题" }
            [IO.File]::WriteAllText((Resolve-Path $cppFile).Path, $cpp, $utf8NoBom)
            $rcFile = "windows\runner\Runner.rc"
            $rc = [IO.File]::ReadAllText((Resolve-Path $rcFile).Path, [Text.Encoding]::UTF8)
            $foundDesc = $rc -match 'VALUE "FileDescription", "([^"]*)"'
            $foundProd = $rc -match 'VALUE "ProductName", "([^"]*)"'
            if (-not $foundDesc -or -not $foundProd) { throw "Runner.rc 里没找到 FileDescription/ProductName" }
            $rc = [regex]::Replace($rc, 'VALUE "FileDescription", "[^"]*"', { param($m) 'VALUE "FileDescription", "' + $brandName + '"' })
            $rc = [regex]::Replace($rc, 'VALUE "ProductName", "[^"]*"', { param($m) 'VALUE "ProductName", "' + $brandName + '"' })
            [IO.File]::WriteAllText((Resolve-Path $rcFile).Path, $rc, $utf8NoBom)
            Write-Host "Windows 标题与版本信息串已同步：$brandName"
          } else {
            Write-Host "品牌注入跳过：用包内默认 brand.json"
          }

      - name: Logo 与远程配置域名注入
        # logo_url 为空 → 用仓里自带的 Logo；remote_config_domain 为空 →
        # 用仓里默认值。Logo 填了：下载图片（PNG/JPG/WebP/BMP/GIF 等，
        # 见 tool/normalize_logo.py）→ 转成 PNG 替换 assets/logo/logo.png
        # （应用内顶栏用它；Android 启动器图标在 Android job 里另行重编，
        # Windows .ico 在这里重编，见 tool/regen_windows_icon.py）。
        # 远程配置域名填了：只换 remote_config_service.dart 里
        # workerConfigUrl 的域名，其他代码不动。
        run: |
          $logoUrl = "${{ inputs.logo_url }}"
          if ($logoUrl -ne '') {
            $logoFile = "assets/logo/logo.png"
            $logoTmp = "logo-download.bin"
            Invoke-WebRequest -Uri $logoUrl -OutFile $logoTmp
            python -m pip install --quiet pillow
            python tool/normalize_logo.py $logoTmp $logoFile
            Remove-Item $logoTmp -ErrorAction SilentlyContinue
            Write-Host "Logo 已替换：$logoFile"
            # 0.1.19：Logo 换了就重编 Windows .ico（任务栏与 exe 图标），
            # 与 Android job 里的 regen_launcher_icons.py 同路。
            python tool/regen_windows_icon.py $logoFile
            Write-Host "Windows 图标已重编：windows/runner/resources/app_icon.ico"
          } else {
            Write-Host "Logo 跳过：用仓里自带的 Logo"
          }
          $domain = "${{ inputs.remote_config_domain }}"
          if ($domain -ne '') {
            $domain = $domain.Trim() -replace '^https?://', '' -replace '/.*$', '' -replace '\s', ''
            if ($domain -notmatch '^[A-Za-z0-9.-]+(:[0-9]+)?$') {
              throw "remote_config_domain 不合法（只要域名，如 cc.jiankong.cf）"
            }
            $configFile = "lib/services/remote_config_service.dart"
            $content = Get-Content $configFile -Raw
            $new = $content -replace "(workerConfigUrl =\s*')https://cc\.jiankong\.cf(/client-config\.json')", "`$1https://$domain`$2"
            if ($new -eq $content) { throw "远程配置默认地址替换失败（没找到 workerConfigUrl）" }
            [IO.File]::WriteAllText((Resolve-Path $configFile).Path, $new, [Text.UTF8Encoding]::new($false))
            Write-Host "远程配置默认地址已换成：https://$domain/client-config.json"
          } else {
            Write-Host "远程配置域名跳过：用仓里默认值"
          }

      - name: 装 Go 1.26.10（编打补丁的 sing-box 内核）
        # 0.1.20：Go 版本钉 1.26.10（sing-box 1.14.4 的 tag 构建用的
        # 版本，见 tool/sing-box-patches/README.md），不用 go.mod 的
        # 最低版 1.25.5。
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: 编 sing-box 内核（Windows 资产，打补丁版）
        # 0.1.20：sing-box.exe（amd64 79MB／arm64 72MB）太大，
        # Git Data API 拒收（422 input too large），不进仓；
        # 且未打补丁的上游 1.14.4 握不过 Xray v26.11.9 的 REALITY
        # （Windows 上三个 REALITY 节点测速全报“握手失败”，
        # 同 NekoBox 1.4.2 的失败模式；Android 的 libbox 早已打
        # 同一份补丁）。CI 在这里从源码编打补丁版：
        # 下 sing-box 1.14.4 源码 → git apply reality-xray.patch
        # → 下 metacubex/utls v1.8.7 → git apply utls-presets.patch
        # → go mod edit -replace 指过去 → 交叉编译 windows/amd64
        # 与 windows/arm64（CGO_ENABLED=0，tags 与 libbox 构建一致）
        # → 放进插件资产目录。版本戳 1.14.4-patched（与 libbox 同款，
        # 日志里能认出是补丁版）。helper 是自研小二进制，仍在仓里。
        # 注意：pwsh 里原生命令失败不会自动停住步骤，每步都查
        # $LASTEXITCODE 再 throw。
        run: |
          $ErrorActionPreference = 'Stop'
          $tags = "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api"
          $ldflags = "-X github.com/sagernet/sing-box/constant.Version=1.14.4-patched -s -w -buildid="
          New-Item -ItemType Directory -Force -Path "sb-src" | Out-Null
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/archive/refs/tags/v1.14.4.tar.gz" -OutFile "sb-src/sing-box-1.14.4.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/metacubex/utls/archive/refs/tags/v1.8.7.tar.gz" -OutFile "sb-src/utls-1.8.7.tar.gz"
          tar -xzf "sb-src/sing-box-1.14.4.tar.gz" -C "sb-src"
          if ($LASTEXITCODE -ne 0) { throw "sing-box 源码解压失败" }
          tar -xzf "sb-src/utls-1.8.7.tar.gz" -C "sb-src"
          if ($LASTEXITCODE -ne 0) { throw "utls 源码解压失败" }
          Push-Location "sb-src/sing-box-1.14.4"
          git apply --check "../../tool/sing-box-patches/reality-xray.patch"
          if ($LASTEXITCODE -ne 0) { throw "reality-xray.patch 贴不上（先 --check）" }
          git apply "../../tool/sing-box-patches/reality-xray.patch"
          if ($LASTEXITCODE -ne 0) { throw "reality-xray.patch 应用失败" }
          Pop-Location
          Push-Location "sb-src/utls-1.8.7"
          git apply --check "../../tool/sing-box-patches/utls-presets.patch"
          if ($LASTEXITCODE -ne 0) { throw "utls-presets.patch 贴不上（先 --check）" }
          git apply "../../tool/sing-box-patches/utls-presets.patch"
          if ($LASTEXITCODE -ne 0) { throw "utls-presets.patch 应用失败" }
          Pop-Location
          Push-Location "sb-src/sing-box-1.14.4"
          go mod edit -replace github.com/metacubex/utls=../utls-1.8.7
          if ($LASTEXITCODE -ne 0) { throw "go mod edit -replace 失败" }
          if (-not (Select-String -Path "go.mod" -Pattern "github.com/metacubex/utls => ../utls-1.8.7" -Quiet)) { throw "go.mod 里没找到 utls replace" }
          $env:CGO_ENABLED = "0"
          $env:GOTOOLCHAIN = "local"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -tags $tags -trimpath -ldflags $ldflags -o "../../packages/flutter_sing_box/assets/windows/amd64/sing-box.exe" ./cmd/sing-box
          if ($LASTEXITCODE -ne 0) { throw "sing-box windows/amd64 编译失败" }
          $env:GOARCH = "arm64"
          go build -tags $tags -trimpath -ldflags $ldflags -o "../../packages/flutter_sing_box/assets/windows/arm64/sing-box.exe" ./cmd/sing-box
          if ($LASTEXITCODE -ne 0) { throw "sing-box windows/arm64 编译失败" }
          Pop-Location
          $amd64Exe = "packages\flutter_sing_box\assets\windows\amd64\sing-box.exe"
          $arm64Exe = "packages\flutter_sing_box\assets\windows\arm64\sing-box.exe"
          $verOut = (& $amd64Exe version | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "sing-box.exe version 跑不起来" }
          if ($verOut -notmatch "1.14.4-patched") { throw "sing-box.exe 版本戳不对：$verOut" }
          if ($verOut -notmatch "with_utls") { throw "sing-box.exe 没带 with_utls tag：$verOut" }
          $modOut = (go version -m $amd64Exe | Out-String) -replace "\s+", " "
          if ($modOut -notmatch "metacubex/utls v1.8.7 => ../utls-1.8.7") { throw "sing-box.exe 的 utls replace 没生效" }
          if ((Get-Item $arm64Exe).Length -lt 10MB) { throw "sing-box arm64 exe 太小，不像编出来的" }
          Remove-Item "sb-src" -Recurse -Force
          Write-Host "sing-box 1.14.4-patched 已编好（amd64/arm64），版本与 replace 核对通过"

      - name: 编 Windows
        run: flutter build windows --release

      - name: Windows 签名（OV 证书，Secrets 取）
        # 没填 WINDOWS_CERT_BASE64 时跳过签名，只出未签名包供测试；
        # 正式发布前必须填好证书，否则按 §12.7 D12-3 处理。
        # 注意：step 的 if 不能读本 step 的 env，所以判断写在脚本里。
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64 -eq '') {
            Write-Host "提示：没填 Windows 证书 Secrets，先出未签名包测试，正式发布前补填。"
            exit 0
          }
          $pfx = Join-Path $env:TEMP "zhexuexi-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          Get-ChildItem build\windows\x64\runner\Release\*.exe | ForEach-Object {
            signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }
          Remove-Item $pfx -Force

      - name: 算哈希并上传产物
        # exe 的 SHA-256 写进 Release 文件夹，随 zip 一起发（与 APK
        # 每个包带 .sha256 的做法一致）；下载后解压可校验 exe。
        run: |
          Get-ChildItem build\windows\x64\runner\Release\*.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256"
          }

      - name: 上传 Windows 产物
        # 整个 Release 文件夹原样上传（exe＋flutter_windows.dll＋
        # data/ 等全部运行所需文件）。upload-artifact 本身会打 zip，
        # 下载下来的 artifact 解压就是可直接运行的文件夹，双击 exe
        # 就能跑；不要再手工打一层 zip（那样用户要解压两次）。
        # 0.1.18 之前这里只传 *.exe＋*.sha256，缺 dll 和 data/，
        # exe 单独拿走跑不起来。
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.version || github.ref_name }}
          path: apps/flutter_client/build/windows/x64/runner/Release/
          retention-days: 90

  build-android:
    name: Android
    # 平台门控：与 Windows 任务同理（见上）。
    if: ${{ github.event_name == 'push' || inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: windows-latest
    # 0.1.8：PUB_CACHE 必须与工程同盘。GitHub Windows runner 上工程在 D:\a、
    # Pub Cache 默认在 C:\Users\runneradmin\...，Kotlin 增量编译用
    # File.relativeTo() 存插件源码相对路径，跨盘即抛 "different roots"，
    # 表现为 compileDebugKotlin "Could not close incremental caches"
    #（device_info_plus / package_info_plus，三次同错）。PUB_CACHE 放
    # D:\a\pub-cache 是治本：插件源码与工程同盘，relativeTo() 正常。
    # 注意：flutter-action 的 cache: true 会按 PUB_CACHE 缓存，首跑重下。
    env:
      PUB_CACHE: 'D:\a\pub-cache'
    defaults:
      run:
        shell: pwsh
        working-directory: apps/flutter_client
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Flutter（版本见 docs/versions.md，阶段 0 钉死 3.50.1）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: 品牌注入（§11.1，与 Windows job 相同）
        run: |
          $brandName = "${{ inputs.brand_name }}"
          if ($brandName -ne '') {
            $brandFile = "assets/brand.json"
            $brand = Get-Content $brandFile -Raw | ConvertFrom-Json
            $brand.brand.app_name = $brandName
            $brand | ConvertTo-Json -Depth 5 | Out-File $brandFile -Encoding utf8
            Write-Host "品牌注入完成：应用名=$brandName"
          } else {
            Write-Host "品牌注入跳过：用包内默认 brand.json"
          }

      - name: Logo 与远程配置域名注入
        # 与 Windows job 相同，另加一步：给了 logo_url 时重编 5 档
        # Android 启动器图标（tool/regen_launcher_icons.py；Logo 整个
        # 换，底色也是 Logo 的一部分，不加底；非方形按 cover 居中裁切）。
        run: |
          $logoUrl = "${{ inputs.logo_url }}"
          if ($logoUrl -ne '') {
            $logoFile = "assets/logo/logo.png"
            $logoTmp = "logo-download.bin"
            Invoke-WebRequest -Uri $logoUrl -OutFile $logoTmp
            python -m pip install --quiet pillow
            python tool/normalize_logo.py $logoTmp $logoFile
            Remove-Item $logoTmp -ErrorAction SilentlyContinue
            Write-Host "Logo 已替换：$logoFile"
            python tool/regen_launcher_icons.py $logoFile
          } else {
            Write-Host "Logo 跳过：用仓里自带的 Logo"
          }
          $domain = "${{ inputs.remote_config_domain }}"
          if ($domain -ne '') {
            $domain = $domain.Trim() -replace '^https?://', '' -replace '/.*$', '' -replace '\s', ''
            if ($domain -notmatch '^[A-Za-z0-9.-]+(:[0-9]+)?$') {
              throw "remote_config_domain 不合法（只要域名，如 cc.jiankong.cf）"
            }
            $configFile = "lib/services/remote_config_service.dart"
            $content = Get-Content $configFile -Raw
            $new = $content -replace "(workerConfigUrl =\s*')https://cc\.jiankong\.cf(/client-config\.json')", "`$1https://$domain`$2"
            if ($new -eq $content) { throw "远程配置默认地址替换失败（没找到 workerConfigUrl）" }
            [IO.File]::WriteAllText((Resolve-Path $configFile).Path, $new, [Text.UTF8Encoding]::new($false))
            Write-Host "远程配置默认地址已换成：https://$domain/client-config.json"
          } else {
            Write-Host "远程配置域名跳过：用仓里默认值"
          }

      - name: 编 Android APK
        # keystore 与 key.properties 都由 Secrets 生成（见文件头注释）；
        # 没填 keystore Secrets 时只编 debug 包供测试，不出正式包。
        # release 用 --split-per-abi 出分架构包（arm64/armv7/x86_64）。
        # 0.1.8：kotlin.incremental=false 已在 run 45895860812 试过、无效
        #（Kotlin 2.4 的 BuildToolsApi 路径在非增量模式下仍开关增量缓存），
        # 已改走 PUB_CACHE 同盘（job 级 env），这里不再留无效开关。
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ($env:ANDROID_KEYSTORE_BASE64 -ne '') {
            [IO.File]::WriteAllBytes("android\app\release.keystore", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            if ($env:ANDROID_KEYSTORE_PASSWORD -eq '' -or $env:ANDROID_KEY_PASSWORD -eq '' -or $env:ANDROID_KEY_ALIAS -eq '') {
              throw "已填 keystore，但缺密码 Secrets：ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS 都要填。"
            }
            $keyProps = @(
              "storePassword=$env:ANDROID_KEYSTORE_PASSWORD",
              "keyPassword=$env:ANDROID_KEY_PASSWORD",
              "keyAlias=$env:ANDROID_KEY_ALIAS",
              "storeFile=release.keystore"
            ) -join "`n"
            [IO.File]::WriteAllText("$PWD\android\key.properties", $keyProps, [Text.UTF8Encoding]::new($false))
            flutter build apk --release --split-per-abi
          } else {
            Write-Host "提示：没填 Android keystore Secrets，先编 debug 包测试，正式发布前补填。"
            flutter build apk --debug
          }

      - name: 算哈希并上传产物
        run: |
          Get-ChildItem build\app\outputs\flutter-apk\*.apk | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256"
          }

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version || github.ref_name }}
          path: |
            apps/flutter_client/build/app/outputs/flutter-apk/*.apk
            apps/flutter_client/build/app/outputs/flutter-apk/*.sha256
          retention-days: 90
