# 哲学系客户端 — GitHub 免费 CI
#
# TODO（阶段 0 建工程后接线）：Flutter 工程还没建，本文件里的构建命令是
# 标准占位命令（flutter build windows / flutter build apk），工作流本身
# （触发、矩阵、签名、产物上传）已按 §12 写好。阶段 0 建好 apps/flutter_client
# 后，把下面的 working-directory 改成工程目录，并把品牌注入步骤接上
# brand.json（§11.1），再真跑一次 CI。
#
# 免费说明（§12.0）：本仓是公开仓，GitHub Actions 不计分钟数、免费。
# 私有仓才有免费额度上限；fork 到别的公开仓，CI 照样免费跑。
# 密钥说明：签名用的 6 个 Secrets 在仓库 Settings → Secrets and variables
# → Actions 里填，绝不写进代码、不打日志。fork 不会带走 Secrets，新仓须重填。

name: build

on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: "应用名（默认：哲学系）"
        required: false
        default: "哲学系"
        type: string
      version:
        description: "版本号 x.y.z（留空自动用最新 tag +1，见 §11.5）"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Java 17（Android 构建要用）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Flutter（版本阶段 0 钉死最新稳定版）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: 品牌注入（占位，阶段 0 接线）
        # 阶段 0：把 workflow 输入 brand_name / version 写成 brand.json，
        # 再由 Flutter 编译前读它生成应用名、图标、主色、订阅地址（§11.1）。
        # 现在只做一件事：没有 brand.json 就用默认值建一个，不让构建中途停。
        run: |
          if (-not (Test-Path brand.json)) {
            @{ app_name = "${{ inputs.brand_name || '哲学系' }}"; version = "${{ inputs.version }}" } | ConvertTo-Json | Out-File brand.json -Encoding utf8
          }
          Write-Host "品牌注入完成（占位）：应用名=${{ inputs.brand_name || '哲学系' }}"

      - name: 编 Windows
        # TODO（阶段 0）：working-directory 改成 apps/flutter_client。
        run: flutter build windows --release

      - name: Windows 签名（OV 证书，Secrets 取）
        # 没填 WINDOWS_CERT_BASE64 时跳过签名，只出未签名包供测试；
        # 正式发布前必须填好证书，否则按 §12.7 D12-3 处理。
        # 注意：step 的 if 不能读本 step 的 env，所以判断写在脚本里。
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64 -eq '') {
            Write-Host "提示：没填 Windows 证书 Secrets，先出未签名包测试，正式发布前补填。"
            exit 0
          }
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          Get-ChildItem build\windows\x64\runner\Release\*.exe | ForEach-Object {
            signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }
          Remove-Item $pfx -Force

      - name: 算哈希并上传产物
        run: |
          Get-ChildItem build\windows\x64\runner\Release\*.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256"
          }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.version || github.ref_name }}
          path: |
            build/windows/x64/runner/Release/*.exe
            build/windows/x64/runner/Release/*.sha256
          retention-days: 90

  build-android:
    name: Android
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Flutter（版本阶段 0 钉死最新稳定版）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
          cache: true

      - name: 品牌注入（占位，阶段 0 接线）
        run: |
          if (-not (Test-Path brand.json)) {
            @{ app_name = "${{ inputs.brand_name || '哲学系' }}"; version = "${{ inputs.version }}" } | ConvertTo-Json | Out-File brand.json -Encoding utf8
          }
          Write-Host "品牌注入完成（占位）：应用名=${{ inputs.brand_name || '哲学系' }}"

      - name: 编 Android APK
        # TODO（阶段 0）：working-directory 改成 apps/flutter_client。
        # keystore 由 Secrets 还原到本地，构建命令用 --release 签名；
        # 没填 keystore Secrets 时只编 debug 包供测试，不出正式包。
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ($env:ANDROID_KEYSTORE_BASE64 -ne '') {
            [IO.File]::WriteAllBytes("android\app\release.keystore", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            flutter build apk --release
          } else {
            Write-Host "提示：没填 Android keystore Secrets，先编 debug 包测试，正式发布前补填。"
            flutter build apk --debug
          }

      - name: 算哈希并上传产物
        run: |
          Get-ChildItem build\app\outputs\flutter-apk\*.apk | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256"
          }

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version || github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/*.sha256
          retention-days: 90
