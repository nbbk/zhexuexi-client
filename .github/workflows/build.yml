# 哲学系客户端 — GitHub 免费 CI
#
# 手动打包入口（不用等 tag，不用本地编）：
#   仓库 → Actions → build → Run workflow，填下面五个输入，点运行。
#   产物在那次运行页面的底部 Artifacts 里下载，保留 90 天。
#
# 五个输入（workflow_dispatch）：
#   brand_name：应用名（默认“哲学系”），只改包内 brand.json 的 app_name。
#   version：版本号 x.y.z（留空时产物名用分支/tag 名）。
#   logo_url：Logo 图片地址（选填）。空着用仓里自带的 Logo；
#     填了会在构建前下载，替换包内 Logo（assets/logo/logo.png，
#     应用内顶栏与启动器图标源图都用它），并重编 Android 启动器图标。
#     支持 PNG / JPG / WebP / BMP / GIF 等常见格式（见
#     apps/flutter_client/tool/normalize_logo.py），下载后统一转成
#     PNG；不是图片时构建直接报错，不出包。
#     Logo 是整个换的：底色也是 Logo 的一部分，传什么底色、启动器
#     图标就是什么底色，不再贴到墨蓝底上。最好传方形图（含底色），
#     如 1024×1024；非方形按 cover 居中裁切填满，不拉伸
#     （见 apps/flutter_client/tool/regen_launcher_icons.py）。
#   remote_config_domain：远程配置域名（选填，如 cc.jiankong.cf）。
#     空着用仓里默认值；填了只换远程配置默认地址
#     （lib/services/remote_config_service.dart 的 workerConfigUrl）
#     里的域名，其他代码不动。填完整 URL 也行，只取 host。
#
# 自动触发：push tag v* 时也跑（version 取 tag 名；platform 为空时两个任务都跑）。
#
# Secrets（仓库 Settings → Secrets and variables → Actions 里填，
# 绝不写进代码、不打日志；fork 不会带走 Secrets，新仓须重填）：
#   Android 正式版（release 签名，4 个，缺一不可；只填 keystore
#   不填密码时构建直接报错，不静默出未签名包）：
#     ANDROID_KEYSTORE_BASE64：release keystore 文件的 base64
#       （本地跑 base64 -w0 <keystore 文件> 得到，别贴到聊天里）。
#     ANDROID_KEYSTORE_PASSWORD：keystore 的 storePassword。
#     ANDROID_KEY_PASSWORD：key 的 keyPassword。
#     ANDROID_KEY_ALIAS：keyAlias（如 zhexuexi）。
#     没填 keystore 时只编 debug 包供测试（不能升级、不是正式版）。
#   Windows 签名（2 个）：
#     WINDOWS_CERT_BASE64：OV 证书 pfx 的 base64。
#     WINDOWS_CERT_PASSWORD：证书密码。
#     没填时只出未签名包供测试。
#
# 产物：
#   Android：分架构三个 APK（arm64-v8a / armeabi-v7a / x86_64，
#     各带 .sha256），小米手机用 arm64-v8a。
#   Windows：未签名或已签名的 .exe。
#
# 注意：本流程此前一次都没跑通过，第一次跑就是测试；跑不通时
# 先看 Actions 日志，不要声称 CI 跑过。
#
# 免费说明（§12.0）：本仓是公开仓，GitHub Actions 不计分钟数、免费。
# 私有仓才有免费额度上限；fork 到别的公开仓，CI 照样免费跑。

name: build

on:
  workflow_dispatch:
    inputs:
      brand_name:
        description: "应用名（默认：哲学系）"
        required: false
        default: "哲学系"
        type: string
      version:
        description: "版本号 x.y.z（留空自动用最新 tag +1，见 §11.5）"
        required: false
        default: ""
        type: string
      logo_url:
        description: "Logo 图片地址（PNG/JPG/WebP 等，选填；空着用仓里自带的 Logo；底色也是 Logo 的一部分，整个换）"
        required: false
        default: ""
        type: string
      remote_config_domain:
        description: "远程配置域名（选填，如 cc.jiankong.cf；空着用仓里默认值）"
        required: false
        default: ""
        type: string
      platform:
        description: "打包平台（all：Windows＋安卓一起打；windows：只打 Windows exe；android：只打安卓 APK）。打 tag 发版时此项为空，按全部处理，两个任务都跑。"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - windows
          - android
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows
    # 平台门控：手动触发时按 platform 输入选；push tag 时 inputs 为空，
    # github.event_name == 'push' 兜底，两个任务都跑，不会跳过。
    if: ${{ github.event_name == 'push' || inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/flutter_client
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Java 17（Android 构建要用）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Flutter（版本见 docs/versions.md，阶段 0 钉死 3.50.1）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: 品牌注入（§11.1）
        # 只改包内默认 brand.json 的 app_name；颜色/Logo/订阅地址等其他
        # 品牌变量在阶段 1 由远程配置中心下发，不在这里填。
        # 没传 brand_name 时不动包内文件，直接用默认值构建。
        run: |
          $brandName = "${{ inputs.brand_name }}"
          if ($brandName -ne '') {
            $brandFile = "assets/brand.json"
            $brand = Get-Content $brandFile -Raw | ConvertFrom-Json
            $brand.brand.app_name = $brandName
            $brand | ConvertTo-Json -Depth 5 | Out-File $brandFile -Encoding utf8
            Write-Host "品牌注入完成：应用名=$brandName"
          } else {
            Write-Host "品牌注入跳过：用包内默认 brand.json"
          }

      - name: Logo 与远程配置域名注入
        # logo_url 为空 → 用仓里自带的 Logo；remote_config_domain 为空 →
        # 用仓里默认值。Logo 填了：下载图片（PNG/JPG/WebP/BMP/GIF 等，
        # 见 tool/normalize_logo.py）→ 转成 PNG 替换 assets/logo/logo.png
        # （应用内顶栏用它；Android 启动器图标在 Android job 里另行重编）。
        # 远程配置域名填了：只换 remote_config_service.dart 里
        # workerConfigUrl 的域名，其他代码不动。
        run: |
          $logoUrl = "${{ inputs.logo_url }}"
          if ($logoUrl -ne '') {
            $logoFile = "assets/logo/logo.png"
            $logoTmp = "logo-download.bin"
            Invoke-WebRequest -Uri $logoUrl -OutFile $logoTmp
            python -m pip install --quiet pillow
            python tool/normalize_logo.py $logoTmp $logoFile
            Remove-Item $logoTmp -ErrorAction SilentlyContinue
            Write-Host "Logo 已替换：$logoFile"
          } else {
            Write-Host "Logo 跳过：用仓里自带的 Logo"
          }
          $domain = "${{ inputs.remote_config_domain }}"
          if ($domain -ne '') {
            $domain = $domain.Trim() -replace '^https?://', '' -replace '/.*$', '' -replace '\s', ''
            if ($domain -notmatch '^[A-Za-z0-9.-]+(:[0-9]+)?$') {
              throw "remote_config_domain 不合法（只要域名，如 cc.jiankong.cf）"
            }
            $configFile = "lib/services/remote_config_service.dart"
            $content = Get-Content $configFile -Raw
            $new = $content -replace "(workerConfigUrl =\s*')https://cc\.jiankong\.cf(/client-config\.json')", "`$1https://$domain`$2"
            if ($new -eq $content) { throw "远程配置默认地址替换失败（没找到 workerConfigUrl）" }
            [IO.File]::WriteAllText((Resolve-Path $configFile).Path, $new, [Text.UTF8Encoding]::new($false))
            Write-Host "远程配置默认地址已换成：https://$domain/client-config.json"
          } else {
            Write-Host "远程配置域名跳过：用仓里默认值"
          }

      - name: 编 Windows
        run: flutter build windows --release

      - name: Windows 签名（OV 证书，Secrets 取）
        # 没填 WINDOWS_CERT_BASE64 时跳过签名，只出未签名包供测试；
        # 正式发布前必须填好证书，否则按 §12.7 D12-3 处理。
        # 注意：step 的 if 不能读本 step 的 env，所以判断写在脚本里。
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ($env:WINDOWS_CERT_BASE64 -eq '') {
            Write-Host "提示：没填 Windows 证书 Secrets，先出未签名包测试，正式发布前补填。"
            exit 0
          }
          $pfx = Join-Path $env:TEMP "zhexuexi-cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          Get-ChildItem build\windows\x64\runner\Release\*.exe | ForEach-Object {
            signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $_.FullName
          }
          Remove-Item $pfx -Force

      - name: 算哈希并上传产物
        run: |
          Get-ChildItem build\windows\x64\runner\Release\*.exe | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256"
          }

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ inputs.version || github.ref_name }}
          path: |
            apps/flutter_client/build/windows/x64/runner/Release/*.exe
            apps/flutter_client/build/windows/x64/runner/Release/*.sha256
          retention-days: 90

  build-android:
    name: Android
    # 平台门控：与 Windows 任务同理（见上）。
    if: ${{ github.event_name == 'push' || inputs.platform == '' || inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: windows-latest
    # 0.1.8：PUB_CACHE 必须与工程同盘。GitHub Windows runner 上工程在 D:\a、
    # Pub Cache 默认在 C:\Users\runneradmin\...，Kotlin 增量编译用
    # File.relativeTo() 存插件源码相对路径，跨盘即抛 "different roots"，
    # 表现为 compileDebugKotlin "Could not close incremental caches"
    #（device_info_plus / package_info_plus，三次同错）。PUB_CACHE 放
    # D:\a\pub-cache 是治本：插件源码与工程同盘，relativeTo() 正常。
    # 注意：flutter-action 的 cache: true 会按 PUB_CACHE 缓存，首跑重下。
    env:
      PUB_CACHE: 'D:\a\pub-cache'
    defaults:
      run:
        shell: pwsh
        working-directory: apps/flutter_client
    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 装 Flutter（版本见 docs/versions.md，阶段 0 钉死 3.50.1）
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: 品牌注入（§11.1，与 Windows job 相同）
        run: |
          $brandName = "${{ inputs.brand_name }}"
          if ($brandName -ne '') {
            $brandFile = "assets/brand.json"
            $brand = Get-Content $brandFile -Raw | ConvertFrom-Json
            $brand.brand.app_name = $brandName
            $brand | ConvertTo-Json -Depth 5 | Out-File $brandFile -Encoding utf8
            Write-Host "品牌注入完成：应用名=$brandName"
          } else {
            Write-Host "品牌注入跳过：用包内默认 brand.json"
          }

      - name: Logo 与远程配置域名注入
        # 与 Windows job 相同，另加一步：给了 logo_url 时重编 5 档
        # Android 启动器图标（tool/regen_launcher_icons.py；Logo 整个
        # 换，底色也是 Logo 的一部分，不加底；非方形按 cover 居中裁切）。
        run: |
          $logoUrl = "${{ inputs.logo_url }}"
          if ($logoUrl -ne '') {
            $logoFile = "assets/logo/logo.png"
            $logoTmp = "logo-download.bin"
            Invoke-WebRequest -Uri $logoUrl -OutFile $logoTmp
            python -m pip install --quiet pillow
            python tool/normalize_logo.py $logoTmp $logoFile
            Remove-Item $logoTmp -ErrorAction SilentlyContinue
            Write-Host "Logo 已替换：$logoFile"
            python tool/regen_launcher_icons.py $logoFile
          } else {
            Write-Host "Logo 跳过：用仓里自带的 Logo"
          }
          $domain = "${{ inputs.remote_config_domain }}"
          if ($domain -ne '') {
            $domain = $domain.Trim() -replace '^https?://', '' -replace '/.*$', '' -replace '\s', ''
            if ($domain -notmatch '^[A-Za-z0-9.-]+(:[0-9]+)?$') {
              throw "remote_config_domain 不合法（只要域名，如 cc.jiankong.cf）"
            }
            $configFile = "lib/services/remote_config_service.dart"
            $content = Get-Content $configFile -Raw
            $new = $content -replace "(workerConfigUrl =\s*')https://cc\.jiankong\.cf(/client-config\.json')", "`$1https://$domain`$2"
            if ($new -eq $content) { throw "远程配置默认地址替换失败（没找到 workerConfigUrl）" }
            [IO.File]::WriteAllText((Resolve-Path $configFile).Path, $new, [Text.UTF8Encoding]::new($false))
            Write-Host "远程配置默认地址已换成：https://$domain/client-config.json"
          } else {
            Write-Host "远程配置域名跳过：用仓里默认值"
          }

      - name: 编 Android APK
        # keystore 与 key.properties 都由 Secrets 生成（见文件头注释）；
        # 没填 keystore Secrets 时只编 debug 包供测试，不出正式包。
        # release 用 --split-per-abi 出分架构包（arm64/armv7/x86_64）。
        # 0.1.8：kotlin.incremental=false 已在 run 45895860812 试过、无效
        #（Kotlin 2.4 的 BuildToolsApi 路径在非增量模式下仍开关增量缓存），
        # 已改走 PUB_CACHE 同盘（job 级 env），这里不再留无效开关。
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if ($env:ANDROID_KEYSTORE_BASE64 -ne '') {
            [IO.File]::WriteAllBytes("android\app\release.keystore", [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
            if ($env:ANDROID_KEYSTORE_PASSWORD -eq '' -or $env:ANDROID_KEY_PASSWORD -eq '' -or $env:ANDROID_KEY_ALIAS -eq '') {
              throw "已填 keystore，但缺密码 Secrets：ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS 都要填。"
            }
            $keyProps = @(
              "storePassword=$env:ANDROID_KEYSTORE_PASSWORD",
              "keyPassword=$env:ANDROID_KEY_PASSWORD",
              "keyAlias=$env:ANDROID_KEY_ALIAS",
              "storeFile=release.keystore"
            ) -join "`n"
            [IO.File]::WriteAllText("$PWD\android\key.properties", $keyProps, [Text.UTF8Encoding]::new($false))
            flutter build apk --release --split-per-abi
          } else {
            Write-Host "提示：没填 Android keystore Secrets，先编 debug 包测试，正式发布前补填。"
            flutter build apk --debug
          }

      - name: 算哈希并上传产物
        run: |
          Get-ChildItem build\app\outputs\flutter-apk\*.apk | ForEach-Object {
            (Get-FileHash $_.FullName -Algorithm SHA256).Hash | Out-File "$($_.FullName).sha256"
          }

      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.version || github.ref_name }}
          path: |
            apps/flutter_client/build/app/outputs/flutter-apk/*.apk
            apps/flutter_client/build/app/outputs/flutter-apk/*.sha256
          retention-days: 90
